services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: askitall_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askitall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askitall_password}
      POSTGRES_DB: ${POSTGRES_DB:-askitall_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askitall} -d ${POSTGRES_DB:-askitall_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - askitall_net

  redis:
    image: redis:7-alpine
    container_name: askitall_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - askitall_net

  neo4j:
    image: neo4j:5-community
    container_name: askitall_neo4j
    restart: always
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-askitall_graph_password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - askitall_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: askitall_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - askitall_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: askitall_celery_worker
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - askitall_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: askitall_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - askitall_net

networks:
  askitall_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  uploads_data:
